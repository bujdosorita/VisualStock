<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <rect width="256" height="256" fill="#050510" rx="40" ry="40"/>
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g filter="url(#glow)">
    <!-- Top Face -->
    <path d="M 128 30 L 208 76 L 128 122 L 48 76 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Right Face -->
    <path d="M 134 134 L 214 88 L 214 180 L 134 226 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
    
    <!-- Left Face -->
    <path d="M 122 134 L 42 88 L 42 180 L 122 226 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
  </g>
  <g>
    <!-- Crisp Foreground Overlay to punch through the blur -->
    <path d="M 128 30 L 208 76 L 128 122 L 48 76 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 134 134 L 214 88 L 214 180 L 134 226 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
    <path d="M 122 134 L 42 88 L 42 180 L 122 226 Z" fill="none" stroke="#00f3ff" stroke-width="20" stroke-linejoin="round"/>
  </g>
</svg>