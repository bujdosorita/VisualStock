<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualStock Premium</title>
    <meta name="theme-color" content="#050510">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css?v=31">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="apple-touch-icon" href="icon.svg">
</head>

<body>

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header>
        <div class="header-content">
            <div class="brand">
                <div class="logo-icon"><i class="ph-fill ph-cube-transparent"></i></div>
                <div>
                    <h1>VISUALSTOCK</h1>
                    <div class="subtitle">Üzletberendezés Raktár <span class="divider">///</span> Élőkép</div>
                </div>
            </div>

            <div class="header-right">

                <div class="system-status">
                    <div class="badge-kulcssoft">
                        <i class="ph-bold ph-arrows-left-right"></i> Kulcs-Soft Kapcsolat
                        <span class="status-dot online"></span>
                    </div>

                    <div class="clock-badge">
                        <i class="ph-bold ph-clock"></i> <span id="clock">--:--</span>
                    </div>
                </div>

                <button class="btn-sync" onclick="simulateSync()">
                    <i class="ph-bold ph-arrows-clockwise"></i> <span>Adatok Szinkronizálása</span>
                </button>

            </div>
        </div>
    </header>

    <main class="controls-container">
        <div class="search-wrapper">
            <i class="ph-bold ph-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" placeholder="Keresés név vagy cikkszám alapján..."
                onkeyup="filterStock()">
        </div>

        <div class="category-buttons">
            <button onclick="filterCategory('all', true)" class="active-btn"><i class="ph-fill ph-squares-four"></i>
                Összes</button>
            <button onclick="filterCategory('sztender')"><i class="ph-bold ph-coat-hanger"></i> Sztenderek,
                Ruhaállványok</button>
            <button onclick="filterCategory('vallfa')"><i class="ph-bold ph-t-shirt"></i> Fa, műanyag, fém
                vállfák</button>
            <button onclick="filterCategory('cimkezo')"><i class="ph-bold ph-tag"></i> Szálbelövők, Ruha Címke</button>
            <button onclick="filterCategory('vonalcimke')"><i class="ph-bold ph-barcode"></i> Vonalkód- és
                Körcímkék</button>
            <button onclick="filterCategory('arazogep')"><i class="ph-bold ph-currency-circle-dollar"></i> Árazógépek és
                Árazószalagok</button>
            <button onclick="filterCategory('ruhazsak')"><i class="ph-bold ph-bag"></i> Ruhazsák, Öltönyzsák,
                Ruhafólia</button>
            <button onclick="filterCategory('polccimke')"><i class="ph-bold ph-rows"></i> Ársínek, Polccímkék</button>
            <button onclick="filterCategory('plexitok')"><i class="ph-bold ph-frame-corners"></i> Plexi Laptok, Infó
                Tábla</button>
            <button onclick="filterCategory('kasszaszalag')"><i class="ph-bold ph-receipt"></i>
                Pénztárgépszalagok</button>
            <button onclick="filterCategory('taska')"><i class="ph-bold ph-shopping-bag"></i> Nylon táska, Ingvállas
                táskák</button>
            <button onclick="filterCategory('irodaszer')"><i class="ph-bold ph-paperclip"></i> Irodaszerek,
                Kábelkötegelők</button>
            <button onclick="filterCategory('kosar')"><i class="ph-bold ph-shopping-cart"></i> Bevásáló Kosár</button>
        </div>
    </main>

    <div id="app" class="grid-container"></div>

    <!-- Footer decoration or info could go here -->

    <footer class="app-footer">
        <div class="footer-content">
            <div class="footer-branding">
                <span class="copyright">© 2026 VISUALSTOCK PREMIUM</span>
                <span class="tagline">Professional Inventory Management Solutions</span>
            </div>
            <div class="footer-version">v28.0.4 - All Rights Reserved</div>
        </div>
    </footer>

    <script src="script.js?v=31"></script>
</body>

</html>
